<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 330" width="490" height="330" font-family="Noto Sans JP, sans-serif" font-size="13" fill="#1f2937"><rect width="490" height="330" fill="#fff"/><rect x="60" y="40" width="240" height="180" fill="#dbeafe" stroke="#2563eb"/><text x="180.0" y="124.0" text-anchor="middle" font-weight="bold">元の面積 y = u₁u₂</text><text x="180.0" y="144.0" text-anchor="middle" font-size="12">4 × 6 = 24</text><rect x="300" y="40" width="60" height="180" fill="#fde68a" stroke="#b45309"/><text x="330.0" y="124.0" text-anchor="middle" font-size="11">u₁だけ</text><text x="330.0" y="140.0" text-anchor="middle" font-size="11">増えた分</text><text x="330.0" y="158.0" text-anchor="middle" font-size="11" font-weight="bold">u₂·Δu₁</text><rect x="60" y="220" width="240" height="45" fill="#bbf7d0" stroke="#059669"/><text x="180.0" y="247.5" text-anchor="middle" font-size="12">u₂だけ増えた分　<tspan font-weight="bold">u₁·Δu₂</tspan></text><rect x="300" y="220" width="60" height="45" fill="#fecaca" stroke="#dc2626"/><text x="330.0" y="246.5" text-anchor="middle" font-size="10">Δu₁·Δu₂</text><line x1="374" y1="242.5" x2="390" y2="242.5" stroke="#dc2626"/><text x="394" y="238.5" font-size="11" fill="#dc2626">ごく小さい</text><text x="394" y="254.5" font-size="11" fill="#dc2626">（小×小）</text><text x="180.0" y="30" text-anchor="middle" font-size="12">u₁ = 4</text><text x="330.0" y="30" text-anchor="middle" font-size="12">Δu₁</text><text x="52" y="134.0" text-anchor="end" font-size="12">u₂ = 6</text><text x="52" y="246.5" text-anchor="end" font-size="12">Δu₂</text><text x="230.0" y="316" text-anchor="middle" font-size="12">増えた面積 Δy ＝ 黄 ＋ 緑 ＋ 赤 ≈ 黄 ＋ 緑</text></svg>