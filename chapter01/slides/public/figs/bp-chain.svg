<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="920" height="310" font-family="Noto Sans JP, sans-serif">
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="920" height="310" fill="#ffffff"/>
<circle cx="80" cy="140" r="32" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="80.0" y="147.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">x</text>
<rect x="190" y="108" width="170" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="275.0" y="145.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="normal">g：u = 3x + 1</text>
<circle cx="470" cy="140" r="32" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="470.0" y="147.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">u</text>
<rect x="580" y="108" width="150" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="655.0" y="145.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="normal">f：y = u²</text>
<circle cx="840" cy="140" r="32" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="840.0" y="147.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">y</text>
<line x1="112.0" y1="140.0" x2="188.0" y2="140.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="362.0" y1="140.0" x2="436.0" y2="140.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="502.0" y1="140.0" x2="578.0" y2="140.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="732.0" y1="140.0" x2="806.0" y2="140.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<text x="460.0" y="40.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">前向き計算（値）：左 → 右</text>
<line x1="150.0" y1="55.0" x2="770.0" y2="55.0" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
<text x="80.0" y="92.0" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="bold">x = 2</text>
<text x="470.0" y="92.0" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="bold">u = 7</text>
<text x="840.0" y="92.0" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="bold">y = 49</text>
<text x="275.0" y="195.0" font-size="15" fill="#b45309" text-anchor="middle" font-weight="normal">局所微分 du/dx = 3</text>
<text x="655.0" y="195.0" font-size="15" fill="#b45309" text-anchor="middle" font-weight="normal">局所微分 dy/du = 2u = 14</text>
<text x="80.0" y="238.0" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">dy/dx = 14 × 3 = 42</text>
<text x="470.0" y="238.0" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">dy/du = 1 × 14 = 14</text>
<text x="840.0" y="238.0" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">dy/dy = 1</text>
<line x1="770.0" y1="270.0" x2="150.0" y2="270.0" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
<text x="460.0" y="295.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">逆向き計算（勾配）：右 → 左へ、局所微分を掛けていく</text>
</svg>
