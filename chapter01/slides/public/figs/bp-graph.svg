<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 485" width="1000" height="485" font-family="Noto Sans JP, sans-serif">
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="1000" height="485" fill="#ffffff"/>
<circle cx="70" cy="90" r="30" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="70.0" y="97.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">x</text>
<text x="70.0" y="50.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">x = 2</text>
<text x="70.0" y="144.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">∂𝓛/∂x = 12</text>
<circle cx="70" cy="260" r="30" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="70.0" y="267.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">w</text>
<text x="70.0" y="220.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">w = 3</text>
<text x="70.0" y="314.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">∂𝓛/∂w = 8</text>
<circle cx="220" cy="175" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="220.0" y="182.0" font-size="20" fill="#92400e" text-anchor="middle" font-weight="bold">×</text>
<circle cx="360" cy="175" r="30" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="360.0" y="182.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">p</text>
<text x="360.0" y="135.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">p = 6</text>
<text x="360.0" y="229.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">∂𝓛/∂p = 4</text>
<circle cx="360" cy="345" r="30" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="360.0" y="352.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">b</text>
<text x="360.0" y="305.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">b = 1</text>
<text x="360.0" y="399.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">∂𝓛/∂b = 4</text>
<circle cx="500" cy="260" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="500.0" y="267.0" font-size="20" fill="#92400e" text-anchor="middle" font-weight="bold">+</text>
<circle cx="640" cy="260" r="30" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="640.0" y="267.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">z</text>
<text x="640.0" y="220.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">z = 7</text>
<text x="640.0" y="314.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">∂𝓛/∂z = 4</text>
<circle cx="640" cy="90" r="30" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="640.0" y="97.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">t</text>
<text x="640.0" y="50.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">t = 5（正解）</text>
<text x="640.0" y="144.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold"></text>
<circle cx="790" cy="175" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="790.0" y="182.0" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">(·)²</text>
<circle cx="940" cy="175" r="32" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="940.0" y="182.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">𝓛</text>
<text x="940.0" y="133.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">𝓛 = 4</text>
<text x="940.0" y="231.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">∂𝓛/∂𝓛 = 1</text>
<line x1="98.0" y1="100.0" x2="198.0" y2="162.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="98.0" y1="250.0" x2="198.0" y2="188.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="244.0" y1="175.0" x2="328.0" y2="175.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="385.0" y1="190.0" x2="478.0" y2="248.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="385.0" y1="330.0" x2="478.0" y2="272.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="524.0" y1="260.0" x2="608.0" y2="260.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="668.0" y1="245.0" x2="768.0" y2="190.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="668.0" y1="105.0" x2="768.0" y2="160.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="814.0" y1="175.0" x2="906.0" y2="175.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<text x="500.0" y="440.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">× ノード：相手の値を掛けて流す（∂𝓛/∂w = 4 × x = 8, ∂𝓛/∂x = 4 × w = 12）</text>
<text x="500.0" y="466.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">+ ノード：そのまま両方に配る（∂𝓛/∂p = ∂𝓛/∂b = 4）　(·)² ノード：𝓛=(z−t)² の微分 2(z−t) = 4 を掛ける</text>
<text x="30.0" y="26.0" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">青：前向き計算の値</text>
<text x="200.0" y="26.0" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">赤：逆向き計算の勾配</text>
</svg>
