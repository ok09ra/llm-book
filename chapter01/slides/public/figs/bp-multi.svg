<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 340" width="1050" height="340" font-family="Noto Sans JP, sans-serif">
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="1050" height="340" fill="#ffffff"/>
<circle cx="90" cy="170" r="32" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="90.0" y="177.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">x</text>
<circle cx="380" cy="75" r="32" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="380.0" y="82.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">u₁</text>
<circle cx="380" cy="265" r="32" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="380.0" y="272.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">u₂</text>
<circle cx="680" cy="170" r="32" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="680.0" y="177.0" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="normal" font-style="italic">y</text>
<line x1="118.0" y1="155.0" x2="350.0" y2="88.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="118.0" y1="185.0" x2="350.0" y2="252.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="410.0" y1="88.0" x2="652.0" y2="155.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<line x1="410.0" y1="252.0" x2="652.0" y2="185.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<text x="380.0" y="30.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">u₁ = x² = 4</text>
<text x="380.0" y="322.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">u₂ = 3x = 6</text>
<text x="90.0" y="225.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">x = 2</text>
<text x="680.0" y="225.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">y = u₁u₂ = 24</text>
<text x="200.0" y="100.0" font-size="15" fill="#b45309" text-anchor="middle" font-weight="normal">∂u₁/∂x = 2x = 4</text>
<text x="200.0" y="255.0" font-size="15" fill="#b45309" text-anchor="middle" font-weight="normal">∂u₂/∂x = 3</text>
<text x="560.0" y="100.0" font-size="15" fill="#b45309" text-anchor="middle" font-weight="normal">∂y/∂u₁ = u₂ = 6</text>
<text x="560.0" y="255.0" font-size="15" fill="#b45309" text-anchor="middle" font-weight="normal">∂y/∂u₂ = u₁ = 4</text>
<rect x="770" y="95" width="260" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="900.0" y="125.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">経路ごとに掛けて、足す</text>
<text x="900.0" y="160.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">上の経路：6 × 4 = 24</text>
<text x="900.0" y="188.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">下の経路：4 × 3 = 12</text>
<text x="900.0" y="225.0" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">dy/dx = 24 + 12 = 36</text>
</svg>
