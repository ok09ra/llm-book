<text x="153.0" y="252.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">みかん</text>
<rect x="196" y="157.2" width="24" height="72.8" fill="#2563eb"/>
<text x="208.0" y="151.2" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal">0.46</text>
<text x="221.0" y="252.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">りんご</text>
<rect x="264" y="223.3" width="24" height="6.7" fill="#2563eb"/>
<text x="276.0" y="217.3" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal">0.04</text>
<text x="289.0" y="252.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">犬</text>
<rect x="332" y="221.4" width="24" height="8.6" fill="#2563eb"/>
<text x="344.0" y="215.4" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal">0.05</text>
<text x="357.0" y="252.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">猫</text>
<text x="166.0" y="64.0" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="normal">1</text>
<rect x="60" y="268" width="14" height="14" fill="#2563eb"/><text x="80.0" y="280.0" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan font-family="Times New Roman, serif" font-style="italic">ŷ</tspan> = softmax(s)</text>
<rect x="220" y="268" width="14" height="14" fill="#16a34a"/><text x="240.0" y="280.0" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">y（one-hot）</text>
<text x="640.0" y="28.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">勾配 ∂𝓛/∂s = <tspan font-family="Times New Roman, serif" font-style="italic">ŷ</tspan> − y</text>
