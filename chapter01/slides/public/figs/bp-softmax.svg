<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="840" height="325" fill="#ffffff"/>
<text x="210.0" y="28.0" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">予測 <tspan font-family="Times New Roman, serif" font-style="italic">ŷ</tspan> と正解 y（正解＝みかん）</text>
<line x1="40.0" y1="230.0" x2="390.0" y2="230.0" stroke="#6b7280" stroke-width="1.5"/>
