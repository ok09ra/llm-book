<text x="85.0" y="252.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">今日</text>
<rect x="128" y="160.6" width="24" height="69.4" fill="#2563eb"/>
<rect x="154" y="70.0" width="24" height="160.0" fill="#16a34a"/>
