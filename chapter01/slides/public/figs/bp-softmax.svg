<rect x="485" y="137.6" width="34" height="2.4" fill="#dc2626" opacity="0.85"/>
<text x="502.0" y="131.6" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal">+0.02</text>
<text x="502.0" y="262.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">今日</text>
<rect x="553" y="140.0" width="34" height="84.9" fill="#2563eb" opacity="0.85"/>
<text x="570.0" y="240.9" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal">-0.57</text>
<text x="570.0" y="262.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">みかん</text>
<rect x="621" y="71.8" width="34" height="68.2" fill="#dc2626" opacity="0.85"/>
<text x="638.0" y="65.8" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal">+0.46</text>
<text x="638.0" y="262.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">りんご</text>
<rect x="689" y="133.7" width="34" height="6.3" fill="#dc2626" opacity="0.85"/>
<text x="706.0" y="127.7" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal">+0.04</text>
<text x="706.0" y="262.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">犬</text>
<rect x="757" y="131.9" width="34" height="8.1" fill="#dc2626" opacity="0.85"/>
<text x="774.0" y="125.9" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal">+0.05</text>
<text x="774.0" y="262.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">猫</text>
<text x="640.0" y="290.0" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="normal">負 → s を上げる（正解）　正 → s を下げる（不正解）</text>
<text x="640.0" y="312.0" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal">※ 更新は s ← s − α(<tspan font-family="Times New Roman, serif" font-style="italic">ŷ</tspan> − y) の向き</text>
</svg>
