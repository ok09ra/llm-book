<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Noto Sans JP, sans-serif" font-size="13" fill="#1f2937"><rect width="1000" height="470" fill="#fff"/><text x="14" y="30" font-size="16" font-weight="bold" fill="#6d28d9">① Self-Attention（1ヘッド分。4トークンの例）</text><rect x="20" y="114.0" width="56" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="48.0" y="108.0" text-anchor="middle" font-weight="bold" font-size="13">X</text><text x="48.0" y="151.0" text-anchor="middle" font-size="11" fill="#6b7280">4×768</text><text x="90" y="130" text-anchor="middle" font-size="16">×</text><rect x="104" y="97.0" width="16" height="56" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="112.0" y="91.0" text-anchor="middle" font-weight="bold" font-size="13">W<tspan dy="4" font-size="10">Q</tspan></text><text x="112.0" y="168.0" text-anchor="middle" font-size="11" fill="#6b7280">768×64</text><text x="134" y="130" text-anchor="middle" font-size="16">＝</text><rect x="148" y="114.0" width="16" height="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="156.0" y="108.0" text-anchor="middle" font-weight="bold" font-size="13">Q</text><text x="156.0" y="151.0" text-anchor="middle" font-size="11" fill="#6b7280">4×64</text><text x="20" y="58" font-size="11" fill="#6b7280">K, V も同様に W_K, W_V（768×64）で作る</text><text x="194" y="130" text-anchor="middle" font-size="18">→</text><rect x="214" y="114.0" width="16" height="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="222.0" y="108.0" text-anchor="middle" font-weight="bold" font-size="13">Q</text><text x="222.0" y="151.0" text-anchor="middle" font-size="11" fill="#6b7280">4×64</text><text x="242" y="130" text-anchor="middle" font-size="16">×</text><rect x="254" y="117.0" width="22" height="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="265.0" y="111.0" text-anchor="middle" font-weight="bold" font-size="13">Kᵀ</text><text x="265.0" y="148.0" text-anchor="middle" font-size="11" fill="#6b7280">64×4</text><text x="288" y="130" text-anchor="middle" font-size="16">＝</text><rect x="300" y="107.4" width="35.2" height="35.2" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><text x="317.6" y="101.4" text-anchor="middle" font-weight="bold" font-size="13">A</text><text x="317.6" y="157.60000000000002" text-anchor="middle" font-size="11" fill="#6b7280">4×4</text><text x="317.6" y="72" text-anchor="middle" font-size="10" fill="#b45309">÷√64 → 行ごと softmax</text><text x="347.2" y="130" text-anchor="middle" font-size="16">×</text><rect x="359.2" y="114.0" width="16" height="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="367.2" y="108.0" text-anchor="middle" font-weight="bold" font-size="13">V</text><text x="367.2" y="151.0" text-anchor="middle" font-size="11" fill="#6b7280">4×64</text><text x="387.2" y="130" text-anchor="middle" font-size="16">＝</text><rect x="399.2" y="114.0" width="16" height="22" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="407.2" y="108.0" text-anchor="middle" font-weight="bold" font-size="13">出力</text><text x="407.2" y="151.0" text-anchor="middle" font-size="11" fill="#6b7280">4×64</text><text x="445.2" y="130" text-anchor="middle" font-size="18">→</text><text x="505.2" y="72" text-anchor="middle" font-size="11">12ヘッド分を横につなぐ</text><rect x="475.2" y="114.0" width="56" height="22" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="503.2" y="151.0" text-anchor="middle" font-size="11" fill="#6b7280">4×768</text><text x="545.2" y="130" text-anchor="middle" font-size="16">×</text><rect x="559.2" y="97.0" width="56" height="56" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="587.2" y="91.0" text-anchor="middle" font-weight="bold" font-size="13">W<tspan dy="4" font-size="10">O</tspan></text><text x="587.2" y="168.0" text-anchor="middle" font-size="11" fill="#6b7280">768×768</text><text x="629.2" y="130" text-anchor="middle" font-size="16">＝</text><rect x="643.2" y="114.0" width="56" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="671.2" y="108.0" text-anchor="middle" font-weight="bold" font-size="13">H</text><text x="671.2" y="151.0" text-anchor="middle" font-size="11" fill="#6b7280">4×768</text><text x="699.2" y="183" text-anchor="end" font-size="11" fill="#6b7280">＋X（残差）→ LayerNorm</text><text x="500" y="215" text-anchor="middle" font-size="12" fill="#6b7280">A の (i, j) 成分 ＝ Q の i 行と K の j 行の内積 ＝ トークン i が j をどれだけ見るか（前のページの 0.15, 0.05, 0.70, 0.10 が A の1行）</text><line x1="10" y1="240" x2="990" y2="240" stroke="#e5e7eb"/><text x="14" y="272" font-size="16" font-weight="bold" fill="#047857">② Feed-Forward（全トークンまとめて行列で計算）</text><rect x="20" y="349.0" width="56" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="48.0" y="343.0" text-anchor="middle" font-weight="bold" font-size="13">H</text><text x="48.0" y="386.0" text-anchor="middle" font-size="11" fill="#6b7280">4×768</text><text x="90" y="365" text-anchor="middle" font-size="16">×</text><rect x="104" y="332.0" width="134.4" height="56" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="171.2" y="326.0" text-anchor="middle" font-weight="bold" font-size="13">W<tspan dy="4" font-size="10">1</tspan></text><text x="171.2" y="403.0" text-anchor="middle" font-size="11" fill="#6b7280">768×3072</text><text x="258.4" y="365" text-anchor="middle" font-size="16">＝</text><rect x="278.4" y="349.0" width="134.4" height="22" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/><text x="345.59999999999997" y="386.0" text-anchor="middle" font-size="11" fill="#6b7280">4×3072</text><text x="452.79999999999995" y="365" text-anchor="middle" font-size="13">→ GELU →</text><rect x="492.79999999999995" y="349.0" width="134.4" height="22" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/><text x="560.0" y="386.0" text-anchor="middle" font-size="11" fill="#6b7280">4×3072</text><text x="641.1999999999999" y="365" text-anchor="middle" font-size="16">×</text><rect x="655.1999999999999" y="315.2" width="56" height="89.60000000000001" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="683.1999999999999" y="309.2" text-anchor="middle" font-weight="bold" font-size="13">W<tspan dy="4" font-size="10">2</tspan></text><text x="683.1999999999999" y="419.8" text-anchor="middle" font-size="11" fill="#6b7280">3072×768</text><text x="725.1999999999999" y="365" text-anchor="middle" font-size="16">＝</text><rect x="739.1999999999999" y="349.0" width="56" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="767.1999999999999" y="343.0" text-anchor="middle" font-weight="bold" font-size="13">出力</text><text x="767.1999999999999" y="386.0" text-anchor="middle" font-size="11" fill="#6b7280">4×768</text><text x="990" y="330" text-anchor="end" font-size="11" fill="#6b7280">＋H（残差）→ LayerNorm</text><text x="500" y="450" text-anchor="middle" font-size="12" fill="#6b7280">各行（トークン）に同じ W₁, W₂ をかけるだけなので、トークンどうしは混ざらない（各層でバイアスも足す）</text></svg>