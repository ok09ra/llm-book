<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#1f2937"><rect width="980" height="440" fill="#fff"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect x="10" y="10" width="520" height="420" rx="14" fill="#faf5ff" stroke="#e9d5ff"/><text x="270" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#6d28d9">① Self-Attention：周りを見て混ぜる</text><rect x="45.0" y="330" width="70" height="32" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="80" y="351" text-anchor="middle" font-weight="bold">マウス</text><rect x="155.0" y="330" width="70" height="32" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="190" y="351" text-anchor="middle">を</text><rect x="265.0" y="330" width="70" height="32" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="300" y="351" text-anchor="middle">クリック</text><rect x="375.0" y="330" width="70" height="32" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="410" y="351" text-anchor="middle">した</text><path d="M80 330 C 80 260, 270 250, 270 196" fill="none" stroke="#7c3aed" stroke-width="2.8" opacity="0.45" marker-end="url(#p)"/><text x="94" y="300" text-anchor="start" font-size="13" fill="#6d28d9" font-weight="bold">0.15</text><path d="M190 330 C 190 260, 270 250, 270 196" fill="none" stroke="#7c3aed" stroke-width="1.6" opacity="0.38" marker-end="url(#p)"/><text x="204" y="300" text-anchor="start" font-size="13" fill="#6d28d9" font-weight="bold">0.05</text><path d="M300 330 C 300 260, 270 250, 270 196" fill="none" stroke="#7c3aed" stroke-width="9.4" opacity="0.80" marker-end="url(#p)"/><text x="286" y="300" text-anchor="end" font-size="13" fill="#6d28d9" font-weight="bold">0.70</text><path d="M410 330 C 410 260, 270 250, 270 196" fill="none" stroke="#7c3aed" stroke-width="2.2" opacity="0.41" marker-end="url(#p)"/><text x="396" y="300" text-anchor="end" font-size="13" fill="#6d28d9" font-weight="bold">0.10</text><rect x="170" y="150" width="200" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="270" y="170" text-anchor="middle" font-weight="bold">新しい「マウス」</text><text x="270" y="187" text-anchor="middle" font-size="12">＝「クリック」を多めに混ぜたもの</text><text x="270" y="122" text-anchor="middle" font-size="13">→ 動物ではなく <tspan font-weight="bold">パソコンのマウス</tspan> の意味に寄る</text><text x="270" y="378" text-anchor="middle" font-size="12" fill="#6b7280">数字＝「マウス」が各トークンをどれだけ見るか（合計 1）</text><text x="270" y="398" text-anchor="middle" font-size="12" fill="#6b7280">関係が強い相手ほど大きい。これを全トークンについて同時に行う</text><rect x="550" y="10" width="420" height="420" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/><text x="760" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">② Feed-Forward：1語ずつ作り変える</text><rect x="600" y="120" width="22" height="16" rx="2" fill="#a78bfa"/><rect x="600" y="138" width="22" height="16" rx="2" fill="#a78bfa"/><rect x="600" y="156" width="22" height="16" rx="2" fill="#a78bfa"/><rect x="600" y="174" width="22" height="16" rx="2" fill="#a78bfa"/><rect x="600" y="192" width="22" height="16" rx="2" fill="#a78bfa"/><rect x="600" y="210" width="22" height="16" rx="2" fill="#a78bfa"/><rect x="600" y="228" width="22" height="16" rx="2" fill="#a78bfa"/><rect x="600" y="246" width="22" height="16" rx="2" fill="#a78bfa"/><text x="611" y="110" text-anchor="middle" font-size="12">入力</text><text x="611" y="282" text-anchor="middle" font-size="11" fill="#6b7280">768</text><line x1="628" y1="190" x2="680" y2="190" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="690" y="74" width="22" height="13" rx="2" fill="#e5e7eb"/><rect x="690" y="89" width="22" height="13" rx="2" fill="#10b981"/><rect x="690" y="104" width="22" height="13" rx="2" fill="#e5e7eb"/><rect x="690" y="119" width="22" height="13" rx="2" fill="#e5e7eb"/><rect x="690" y="134" width="22" height="13" rx="2" fill="#10b981"/><rect x="690" y="149" width="22" height="13" rx="2" fill="#10b981"/><rect x="690" y="164" width="22" height="13" rx="2" fill="#e5e7eb"/><rect x="690" y="179" width="22" height="13" rx="2" fill="#e5e7eb"/><rect x="690" y="194" width="22" height="13" rx="2" fill="#e5e7eb"/><rect x="690" y="209" width="22" height="13" rx="2" fill="#10b981"/><rect x="690" y="224" width="22" height="13" rx="2" fill="#e5e7eb"/><rect x="690" y="239" width="22" height="13" rx="2" fill="#e5e7eb"/><rect x="690" y="254" width="22" height="13" rx="2" fill="#e5e7eb"/><rect x="690" y="269" width="22" height="13" rx="2" fill="#10b981"/><rect x="690" y="284" width="22" height="13" rx="2" fill="#e5e7eb"/><rect x="690" y="299" width="22" height="13" rx="2" fill="#e5e7eb"/><text x="701" y="64" text-anchor="middle" font-size="12">広げる</text><text x="701" y="330" text-anchor="middle" font-size="11" fill="#6b7280">3072</text><text x="760" y="200" font-size="12" fill="#047857">一部だけ</text><text x="760" y="216" font-size="12" fill="#047857">反応する</text><line x1="818" y1="190" x2="860" y2="190" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="870" y="120" width="22" height="16" rx="2" fill="#34d399"/><rect x="870" y="138" width="22" height="16" rx="2" fill="#34d399"/><rect x="870" y="156" width="22" height="16" rx="2" fill="#34d399"/><rect x="870" y="174" width="22" height="16" rx="2" fill="#34d399"/><rect x="870" y="192" width="22" height="16" rx="2" fill="#34d399"/><rect x="870" y="210" width="22" height="16" rx="2" fill="#34d399"/><rect x="870" y="228" width="22" height="16" rx="2" fill="#34d399"/><rect x="870" y="246" width="22" height="16" rx="2" fill="#34d399"/><text x="881" y="110" text-anchor="middle" font-size="12">出力</text><text x="881" y="282" text-anchor="middle" font-size="11" fill="#6b7280">768</text><text x="760" y="358" text-anchor="middle" font-size="12" fill="#6b7280">集めた情報を、そのトークンの新しい特徴に作り変える</text><text x="760" y="378" text-anchor="middle" font-size="12" fill="#6b7280">全トークンに同じ変換を別々にかける</text><text x="760" y="398" text-anchor="middle" font-size="12" fill="#6b7280">（トークン間のやりとりはない）</text></svg>