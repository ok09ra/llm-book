<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Noto Sans JP, sans-serif" font-size="13" fill="#1f2937"><rect width="600" height="400" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker></defs><text x="300" y="22" text-anchor="middle" font-size="14" font-weight="bold">① 構造：エンコーダ ＋ デコーダ</text><rect x="24" y="190" width="52" height="24" rx="5" fill="#f3f4f6" stroke="#9ca3af"/><text x="50" y="207" text-anchor="middle" font-size="11">ついに</text><line x1="50" y1="190" x2="50" y2="172" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="84" y="190" width="52" height="24" rx="5" fill="#f3f4f6" stroke="#9ca3af"/><text x="110" y="207" text-anchor="middle" font-size="11">始まった</text><line x1="110" y1="190" x2="110" y2="172" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="144" y="190" width="52" height="24" rx="5" fill="#f3f4f6" stroke="#9ca3af"/><text x="170" y="207" text-anchor="middle" font-size="11">３連休</text><line x1="170" y1="190" x2="170" y2="172" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="204" y="190" width="52" height="24" rx="5" fill="#f3f4f6" stroke="#9ca3af"/><text x="230" y="207" text-anchor="middle" font-size="11">…</text><line x1="230" y1="190" x2="230" y2="172" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="96" width="240" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed"/><text x="140.0" y="120.0" text-anchor="middle" font-size="13" font-weight="bold">エンコーダ（12層）</text><text x="140.0" y="138.0" text-anchor="middle" font-size="11">全トークンを前後とも見る</text><text x="140.0" y="156.0" text-anchor="middle" font-size="11">（BERT と同じ）</text><rect x="334" y="190" width="52" height="24" rx="5" fill="#fff" stroke="#9ca3af"/><text x="360" y="207" text-anchor="middle" font-size="11">&lt;開始&gt;</text><line x1="360" y1="190" x2="360" y2="172" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="394" y="190" width="52" height="24" rx="5" fill="#fff" stroke="#9ca3af"/><text x="420" y="207" text-anchor="middle" font-size="11">今夜</text><line x1="420" y1="190" x2="420" y2="172" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="454" y="190" width="52" height="24" rx="5" fill="#fff" stroke="#9ca3af"/><text x="480" y="207" text-anchor="middle" font-size="11">は</text><line x1="480" y1="190" x2="480" y2="172" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="514" y="190" width="52" height="24" rx="5" fill="#fff" stroke="#9ca3af"/><text x="540" y="207" text-anchor="middle" font-size="11">NHK</text><line x1="540" y1="190" x2="540" y2="172" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="96" width="250" height="74" rx="8" fill="#ecfdf5" stroke="#059669"/><text x="455.0" y="120.0" text-anchor="middle" font-size="13" font-weight="bold">デコーダ（12層）</text><text x="455.0" y="138.0" text-anchor="middle" font-size="11">左だけ見て1つずつ生成</text><text x="455.0" y="156.0" text-anchor="middle" font-size="11">（GPT と同じ）</text><line x1="360" y1="96" x2="360" y2="70" stroke="#059669" stroke-width="1.6" marker-end="url(#g)"/><rect x="334" y="44" width="52" height="24" rx="5" fill="#ecfdf5" stroke="#9ca3af"/><text x="360" y="61" text-anchor="middle" font-size="11">今夜</text><line x1="420" y1="96" x2="420" y2="70" stroke="#059669" stroke-width="1.6" marker-end="url(#g)"/><rect x="394" y="44" width="52" height="24" rx="5" fill="#ecfdf5" stroke="#9ca3af"/><text x="420" y="61" text-anchor="middle" font-size="11">は</text><line x1="480" y1="96" x2="480" y2="70" stroke="#059669" stroke-width="1.6" marker-end="url(#g)"/><rect x="454" y="44" width="52" height="24" rx="5" fill="#ecfdf5" stroke="#9ca3af"/><text x="480" y="61" text-anchor="middle" font-size="11">NHK</text><line x1="540" y1="96" x2="540" y2="70" stroke="#059669" stroke-width="1.6" marker-end="url(#g)"/><rect x="514" y="44" width="52" height="24" rx="5" fill="#ecfdf5" stroke="#9ca3af"/><text x="540" y="61" text-anchor="middle" font-size="11">…</text><line x1="262" y1="133" x2="326" y2="133" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/><text x="294" y="124" text-anchor="middle" font-size="10" fill="#dc2626">クロス</text><text x="294" y="152" text-anchor="middle" font-size="10" fill="#dc2626">アテンション</text><text x="300" y="236" text-anchor="middle" font-size="11" fill="#6b7280">デコーダは各層で、エンコーダの出力（k・v）を参照しながら次のトークンを決める</text><line x1="20" y1="252" x2="580" y2="252" stroke="#e5e7eb"/><text x="300" y="276" text-anchor="middle" font-size="14" font-weight="bold">② 事前学習：スパン穴埋め（消した区間の中身を生成）</text><rect x="64" y="292" width="52" height="24" rx="5" fill="#f3f4f6" stroke="#9ca3af"/><text x="90" y="309" text-anchor="middle" font-size="11">今日</text><rect x="126" y="292" width="52" height="24" rx="5" fill="#f3f4f6" stroke="#9ca3af"/><text x="152" y="309" text-anchor="middle" font-size="11">は</text><rect x="188" y="292" width="52" height="24" rx="5" fill="#fde68a" stroke="#9ca3af"/><text x="214" y="309" text-anchor="middle" font-size="11">&lt;X&gt;</text><rect x="250" y="292" width="52" height="24" rx="5" fill="#f3f4f6" stroke="#9ca3af"/><text x="276" y="309" text-anchor="middle" font-size="11">なので</text><rect x="312" y="292" width="52" height="24" rx="5" fill="#fde68a" stroke="#9ca3af"/><text x="338" y="309" text-anchor="middle" font-size="11">&lt;Y&gt;</text><rect x="374" y="292" width="52" height="24" rx="5" fill="#f3f4f6" stroke="#9ca3af"/><text x="400" y="309" text-anchor="middle" font-size="11">行く</text><text x="18" y="309" font-size="11" fill="#6b7280">入力</text><rect x="64" y="340" width="52" height="24" rx="5" fill="#fde68a" stroke="#9ca3af"/><text x="90" y="357" text-anchor="middle" font-size="11">&lt;X&gt;</text><rect x="126" y="340" width="52" height="24" rx="5" fill="#ecfdf5" stroke="#9ca3af"/><text x="152" y="357" text-anchor="middle" font-size="11">良い</text><rect x="188" y="340" width="52" height="24" rx="5" fill="#ecfdf5" stroke="#9ca3af"/><text x="214" y="357" text-anchor="middle" font-size="11">天気</text><rect x="250" y="340" width="52" height="24" rx="5" fill="#fde68a" stroke="#9ca3af"/><text x="276" y="357" text-anchor="middle" font-size="11">&lt;Y&gt;</text><rect x="312" y="340" width="52" height="24" rx="5" fill="#ecfdf5" stroke="#9ca3af"/><text x="338" y="357" text-anchor="middle" font-size="11">散歩</text><rect x="374" y="340" width="52" height="24" rx="5" fill="#ecfdf5" stroke="#9ca3af"/><text x="400" y="357" text-anchor="middle" font-size="11">に</text><text x="18" y="357" font-size="11" fill="#6b7280">正解</text><text x="300" y="388" text-anchor="middle" font-size="11" fill="#6b7280">元の文：今日は 良い 天気 なので 散歩 に 行く（連続した区間を &lt;X&gt; &lt;Y&gt; に置き換える）</text></svg>