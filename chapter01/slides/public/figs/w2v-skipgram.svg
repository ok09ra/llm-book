  <text class="cap" x="906" y="303">正解の周辺語（各 one-hot <tspan font-style="italic" font-weight="bold">y</tspan>）</text>
  <text class="t sm" x="886" y="325" fill="#b91c1c">損失 <tspan font-style="italic">L</tspan> = −log <tspan font-style="italic" font-weight="bold">ŷ</tspan><tspan dy="4" font-size="80%">で</tspan><tspan dy="-4"> </tspan> − log <tspan font-style="italic" font-weight="bold">ŷ</tspan><tspan dy="4" font-size="80%">を</tspan><tspan dy="-4"> </tspan></text>
  <text class="cap" x="906" y="64">1 つの <tspan font-style="italic" font-weight="bold">ŷ</tspan> で</text>
  <text class="cap" x="906" y="80">周辺語 <tspan font-style="italic">n</tspan> 個をそれぞれ当てる</text>
