<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 335" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#222">
  <rect x="0" y="0" width="1010" height="335" fill="#fff"/>
