<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 268" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#222">
  <rect x="0" y="0" width="650" height="268" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker></defs>
  <style>.b{fill:#fff;stroke:#333;stroke-width:1.5}.c{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}.o{fill:#fde68a;stroke:#b45309;stroke-width:1.5}.g{fill:#f3f4f6;stroke:#333;stroke-width:1.5}.cell{fill:#fff;stroke:#555;stroke-width:1}.on{fill:#1d4ed8;stroke:#555;stroke-width:1}.emb{fill:#bfdbfe;stroke:#555;stroke-width:1}.t{text-anchor:middle}.s{font-style:italic}.sm{font-size:13px}.cap{font-size:13px;fill:#555;text-anchor:middle}.ar{fill:none;stroke:#444;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:5 4}.n{font-family:Fira Code,monospace;font-size:12px;text-anchor:middle}</style>

  <rect class="b" x="150" y="60" width="70" height="36" rx="4"/>
  <text class="t" x="185.0" y="84">今日</text>
  <rect class="b" x="234" y="60" width="80" height="36" rx="4"/>
  <text class="t" x="274.0" y="84">こたつ</text>
  <rect class="o" x="328" y="60" width="50" height="36" rx="4"/>
  <text class="t" x="353.0" y="84">で</text>
  <rect class="c" x="392" y="60" width="80" height="36" rx="4"/>
  <text class="t" x="432.0" y="84" font-weight="bold">みかん</text>
  <rect class="o" x="486" y="60" width="50" height="36" rx="4"/>
  <text class="t" x="511.0" y="84">を</text>
  <rect class="b" x="550" y="60" width="80" height="36" rx="4"/>
  <text class="t" x="590.0" y="84">食べる</text>
  <text x="20" y="84" font-weight="bold">窓幅 <tspan font-style="italic">p</tspan> = 1</text>
  <path d="M328 54 v-8 H536 v8" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <text class="t sm" x="432.0" y="40" fill="#b45309">窓（window）：中央語の前後 1 語ずつ → 文脈語 <tspan font-style="italic">n</tspan> = 2</text>
  <rect class="b" x="150" y="170" width="70" height="36" rx="4"/>
  <text class="t" x="185.0" y="194">今日</text>
  <rect class="o" x="234" y="170" width="80" height="36" rx="4"/>
  <text class="t" x="274.0" y="194">こたつ</text>
  <rect class="o" x="328" y="170" width="50" height="36" rx="4"/>
  <text class="t" x="353.0" y="194">で</text>
  <rect class="c" x="392" y="170" width="80" height="36" rx="4"/>
  <text class="t" x="432.0" y="194" font-weight="bold">みかん</text>
  <rect class="o" x="486" y="170" width="50" height="36" rx="4"/>
  <text class="t" x="511.0" y="194">を</text>
  <rect class="o" x="550" y="170" width="80" height="36" rx="4"/>
  <text class="t" x="590.0" y="194">食べる</text>
  <text x="20" y="194" font-weight="bold">窓幅 <tspan font-style="italic">p</tspan> = 2</text>
  <path d="M234 164 v-8 H630 v8" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <text class="t sm" x="432.0" y="150" fill="#b45309">窓（window）：中央語の前後 2 語ずつ → 文脈語 <tspan font-style="italic">n</tspan> = 4</text>
  <rect class="c" x="150" y="240" width="18" height="14" rx="2"/><text class="sm" x="174" y="252">中央語（ターゲット）</text>
  <rect class="o" x="320" y="240" width="18" height="14" rx="2"/><text class="sm" x="344" y="252">周辺語（文脈語）</text>
  <rect class="b" x="460" y="240" width="18" height="14" rx="2"/><text class="sm" x="484" y="252">窓の外</text>
